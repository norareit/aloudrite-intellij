# GitHub does not read the dependencies of a Gradle build from build.gradle.kts, so they are resolved here and
# submitted to the dependency graph of the repository
name: Dependency submission

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The build compiles for Java 25
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/dependency-submission@v6
