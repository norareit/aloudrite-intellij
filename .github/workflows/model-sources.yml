# What the speech models are downloaded from changes outside this repository, without a push, so a check that ran only with
# a build would not see it when it happens. This asks Hugging Face once a week whether it still serves the commits that the
# plugin downloads, and a failed run is mailed to the developer
name: Model sources

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-model-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The build compiles for Java 25
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - run: ./gradlew checkModelSources
