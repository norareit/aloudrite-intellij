# This project's half of the agent sandbox configuration. It layers over the kit's base
# at node_modules/agentrite/container/compose.yml, which holds everything
# that confines the container and is the same for every project. Here is only what
# varies with the project: its names, what it is allowed to reach, how much of the host
# it may use, and, when it has browser tests, the Playwright version they were rendered with.
#
# The kit's container/sandbox.sh passes both files to Compose with --project-directory set
# to this repository, so relative paths resolve from the repository root.
name: aloudrite-intellij-sandbox

services:
  sandbox:
    image: aloudrite-intellij-sandbox

    # Leave the host usable. Overridable from the environment for a heavier run.
    mem_limit: ${SANDBOX_MEM_LIMIT:-8g}
    cpus: ${SANDBOX_CPUS:-6}

    environment:
      # Reachable hosts, over HTTPS on port 443 only, besides those the kit admits
      # itself: the Anthropic API, platform.claude.com, models.opencode.ai,
      # auth.openai.com, chatgpt.com and the npm registry. See
      # KIT_ALLOWLIST in the kit's container/compose.yml. Everything else is denied.
      # Comments and blank lines are ignored. Entries are hostnames only; the
      # entrypoint refuses an address or a CIDR range, and fails to start if a listed
      # host is unreachable. The kit's SANDBOX.md explains the boundary under "Reaching
      # more hosts".
      ALLOWLIST: |
        # Add the hosts this project needs, one per line: the API host of each model
        # provider its agents use besides Anthropic, such as api.openai.com, and what
        # its tools and tests reach, such as github.com for git over HTTPS.
        # The Gradle wrapper, which downloads the Gradle distribution from here.
        services.gradle.org
        # The Gradle distribution, which services.gradle.org redirects to, and the jars of
        # sherpa-onnx, which build.gradle.kts takes from the assets of its GitHub releases.
        github.com
        # The Gradle distribution and the jars of sherpa-onnx, which github.com redirects to.
        release-assets.githubusercontent.com
        # The Gradle plugins of build.gradle.kts, from the Gradle Plugin Portal.
        plugins.gradle.org
        # The artifacts of those plugins, which plugins.gradle.org redirects to.
        plugins-artifacts.gradle.org
        # Maven Central: the dependencies of build.gradle.kts, and those of the plugins, which
        # plugins.gradle.org redirects to.
        repo.maven.apache.org
        # IntelliJ IDEA, which the IntelliJ Platform Gradle Plugin builds and tests against.
        download.jetbrains.com
        # IntelliJ IDEA, which download.jetbrains.com redirects to.
        download-cdn.jetbrains.com
        # The IntelliJ Platform's Maven repositories, of the default repositories of the
        # IntelliJ Platform Gradle Plugin, which it reaches through JetBrains' cache redirector.
        cache-redirector.jetbrains.com
        # The IntelliJ Platform's Maven repositories, which cache-redirector.jetbrains.com
        # redirects to.
        www.jetbrains.com
        # The IntelliJ Platform's releases repository, which www.jetbrains.com redirects to:
        # JetBrains' own distribution on CloudFront, and not CloudFront as a whole.
        d2cico3c979uwg.cloudfront.net
        # The IntelliJ Platform's snapshots repository, which www.jetbrains.com redirects to,
        # another distribution of JetBrains' own on CloudFront.
        d2s4y8xcwt8bet.cloudfront.net
        # The IntelliJ Platform's dependencies repository, which cache-redirector.jetbrains.com
        # redirects to.
        artifacts-caching-proxy.aws.intellij.net
